<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Region Map Generator: procedurally generated fantasy coastlines, rivers, cities and borders, ready to export as SVG or PNG.">
    <meta name="theme-color" content="#131d25">
    <title>Region Map Generator</title>

    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <!-- fonts -->
    <link href='https://fonts.googleapis.com/css?family=Palatino:400' rel='stylesheet' type='text/css'>

    <link rel="stylesheet" href="../css/app.css?v=6">
    <link rel="stylesheet" href="css/style.css?v=6">

    <script>
      // apply the saved theme before first paint so there is no flash
      (function () {
        try {
          var t = localStorage.getItem('art:theme');
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
          if (t === 'light') {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.content = '#e1e9ef';
          }
        } catch (e) {}
      })();
      window.TOOL_PAGE = { id: 'region', title: 'Region Map Generator', sub: 'Coastlines, rivers, cities and borders' };
    </script>

    <!-- javascript -->
    <script src="js/d3.v4.js"></script>
    <script src="../includes/jquery-3.7.1.min.js"></script>
    <script src="js/priority-queue.js"></script>
    <script src="js/language.js"></script>
    <script src="js/terrain.js?v=6"></script>
    <script src="js/saveSvgAsPng.js"></script>
    <script src="js/export.js?v=6"></script>
    <script src="../js/tool-shell.js?v=6"></script>
  </head>
  <body>

    <div id="app">

      <aside id="sidebar">
        <div class="sidebar-head">
          <img class="logo" src="../img/d20-icon-192.png" alt="" width="30" height="30">
          <span class="title">Auto Roll Tables</span>
          <button class="btn icon-btn ghost collapse-btn" id="collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 L9 12 L15 18"/></svg>
          </button>
        </div>
        <nav id="nav" aria-label="Sections"></nav>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>

      <main id="main" tabindex="-1">

        <div class="tool-header">
          <h1 id="view-title">Region Map Generator</h1>
          <span class="sub" id="view-sub"></span>

          <div class="header-actions">
            <button type="button" class="btn small primary refresh" title="Generate a new region">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11 A8 8 0 1 0 18.5 16 M20 5 v6 h-6"/></svg>
              Generate
            </button>
            <button type="button" class="btn small exportsvg" title="Download as SVG">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 v12 M8 11 l4 4 4-4 M4 17 v2 a2 2 0 0 0 2 2 h12 a2 2 0 0 0 2-2 v-2"/></svg>
              SVG
            </button>
            <button type="button" class="btn small exportpng" title="Download as PNG">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 v12 M8 11 l4 4 4-4 M4 17 v2 a2 2 0 0 0 2 2 h12 a2 2 0 0 0 2-2 v-2"/></svg>
              PNG
            </button>
          </div>
        </div>

        <section class="view">
          <div class="map-holder" id="final">
            <div class="map-loading" id="map-loading">Generating region...</div>
          </div>
          <p class="page-foot">
            Region generator by <a href="https://mewo2.com/notes/terrain/" target="_blank" rel="noopener">Martin O'Leary</a>, used under the MIT license.
            <a href="credits.html">Credits</a>.
          </p>
        </section>

      </main>
    </div>

    <nav id="tabbar" aria-label="Sections"></nav>

    <script src="js/init.js?v=6"></script>
  </body>
</html>
